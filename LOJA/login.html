<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">






<style>*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI', Arial;
  background-image: url(fundo.webp);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  min-height:100vh; /* 🔥 melhor que height */
  display:flex;
  justify-content:center;
  align-items:center;

  padding:10px; /* 🔥 evita cortar nas bordas */
}

/* CONTAINER */
.box{
  position: relative;
  width: 90%;        /* 🔥 responsivo */
  max-width: 380px;  /* limite */

  background:linear-gradient(135deg,#1E63B7,#174a91);
  padding:35px 25px;
  border-radius:20px;
  color:white;

  display:flex;
  flex-direction:column;
  gap:20px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25),
    0 0 25px rgba(255,255,255,0.25);
}

/* BOTÃO HOME (direita) */
.fechar-login{
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 20px;
  cursor: pointer;
  color: #ffffff;
  transition: 0.2s;
}

.fechar-login:hover{
  color: #ff7a00;
  transform: scale(1.2);
}

/* BOTÃO LOJA (esquerda) */
.voltar-loja {
  position: absolute;
  top: 15px;
  left: 15px;
  font-size: 20px;
  cursor: pointer;
  color: #ffffff;
  transition: 0.2s;
}

.voltar-loja:hover {
  color: #ff7a00;
  transform: scale(1.2);
}

/* LOGO */
.logo{
  width:150px;
  margin:0 auto;
}

/* TITULO */
h2{
  text-align:center;
}

/* SEÇÕES */
.section{
  font-size:13px;
  font-weight:bold;
  opacity:0.85;
  margin-top:10px;
}

/* INPUT */
.input-group{
  position:relative;
  margin-top:20px;
}

.input-group i{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
}

.input-group input{
  width:100%;
  padding:14px 14px 14px 38px;
  border-radius:12px;
  border:none;
  outline:none;
}

/* LABEL ANIMADA */
.input-group label{
  position:absolute;
  left:38px;
  top:50%;
  transform:translateY(-50%);
  font-size:13px;
  color:#666;
  transition:0.3s;
  pointer-events:none;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label{
  top:-6px;
  font-size:11px;
  color:#0B3C8C;
  background:#fff;
  padding:0 5px;
  border-radius:5px;
}

/* ÍCONE */
.icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:#ff7a00;
}

.input-group i {
  color: #ff7a00; /* já combina com seu tema */
  font-size: 16px;
}

/* BOTÃO */
button{
  width:70%;
  margin:15px auto 0;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#0B3C8C;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  display:block;
  transition:0.3s;
}

button:hover{
  background: #ff7a00;
}

/* TEXTO */
.link{
  text-align:center;
  margin-top:20px;
}

.hidden{
  display:none;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup.show{
  display:flex;
}

.popup-box{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  width:90%;
  max-width:300px; /* 🔥 controla tamanho */
  animation:fadeIn 0.3s ease;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.popup-box p{
  margin-bottom:15px;
  font-weight:500;
  color:#333;
  font-size:14px;
  line-height:1.4;
  word-wrap: break-word; /* 🔥 evita quebrar layout */
}

.popup-box button{
  background:#0B3C8C;
  color:white;
  border:none;

  padding:8px 16px;
  border-radius:8px;

  cursor:pointer;
  font-size:13px;
}

.popup-box button:hover{
  background:#ff7a00;
}

/* ANIMAÇÃO */
@keyframes fadeIn{
  from{
    transform:scale(0.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

/* 📱 RESPONSIVO */
@media (max-width: 480px){

  .box {
    padding: 25px 15px;
    gap: 15px;
    max-width: 309px;
  }

  .logo {
    width: 120px;
  }

  h2 {
    font-size: 18px;
  }

  .input-group input {
    padding: 12px 12px 12px 35px;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 12px;
  }

  .fechar-login,
  .voltar-loja {
    font-size: 18px;
    top: 10px;
  }
}

/* 📱 CELULAR PEQUENO */
@media (max-width: 360px){

  .box {
    padding: 20px 10px;
  }

  .logo {
    width: 100px;
  }

  h2 {
    font-size: 16px;
  }

  .input-group input {
    font-size: 13px;
  }
}

</style>
</head>

<body>

<img src="logo-colegio.png" class="logo">

    <button onclick="fecharPopup()">OK</button>
  </div>
</div>

function voltarHome(){
  window.location.href = "../index.html"; 
}

function voltarLoja(){
  window.location.href = "loja.html";
}

const API_URL = "https://script.google.com/macros/s/AKfycbxJhujz2_krlRSnduyOGzN5m8-SntIVtIg90QPodShBGMGCItcRrZQjBjvXU9HWGPWo/exec";

// 🔥 CONTROLE DE ENVIO
let carregando = false;

// 🔥 ENTER FUNCIONANDO
document.getElementById("chaveLogin").addEventListener("keydown", function(event){
  if(event.key === "Enter"){
    login();
  }
});

// POPUP
function mostrarPopup(msg){
  document.getElementById("popupMsg").innerHTML = msg;
  document.getElementById("popup").classList.add("show");
}

function fecharPopup(){
  document.getElementById("popup").classList.remove("show");
}

// LOGIN
function login(){

  if(carregando) return; // 🔥 evita spam
  carregando = true;

  let chave = document.getElementById("chaveLogin").value.trim();

  if(!chave){
    mostrarPopup("Digite sua matrícula!");
    carregando = false;
    return;
  }

  fetch(API_URL + "?chave=" + chave)
  .then(res => res.json())
  .then(data=>{

    console.log("RETORNO API:", data);

    if(data && data.existe){

      localStorage.setItem("logado","true");
      localStorage.setItem("chave", chave);

      if(data.nomeResp){
        localStorage.setItem("nomeResp", data.nomeResp);
      }
      window.location.href = "loja.html";
    }
    else{
mostrarPopup(`<span style="color:#0B3C8C;"><strong>Matrícula não localizada.</strong></span><br>
  <span style="color:#ff7a00;">Confira as informações digitadas...</span>
`);
    }
  })
  .catch(()=>{
    mostrarPopup("Erro ao conectar com servidor");
    carregando = false;
  });
}
</script>
